<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portals</title>
<meta name="description" content="An endless flight through procedurally generated worlds, each one reached through a portal in the last.">
<!-- link previews: crawlers run no scripts, so these are static; the picture is og.jpg at the site's root (1200 by 630) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Portals">
<meta property="og:title" content="Portals">
<meta property="og:description" content="An endless, hands-off flight through hundreds of generated worlds, each reached through a portal in the last.">
<meta property="og:url" content="https://portals-endless-worlds.netlify.app/">
<meta property="og:image" content="https://portals-endless-worlds.netlify.app/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A view from inside one of the worlds of Portals">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Portals">
<meta name="twitter:description" content="An endless, hands-off flight through hundreds of generated worlds, each reached through a portal in the last.">
<meta name="twitter:image" content="https://portals-endless-worlds.netlify.app/og.jpg">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portals">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%23081020' stroke='%239fd0ff' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/ui.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="veil"><div id="veil-title">Portals</div><div id="veil-sub">finding a world</div></div>
<div id="title"><div id="title-name"></div><div id="title-line"></div><div id="title-after"></div><div id="title-meta"></div></div>
<div id="hud">
  <button id="b-pause" title="Pause (space)" aria-label="Pause">
    <svg class="i a" viewBox="0 0 16 16"><path d="M5 3v10M11 3v10"/></svg><svg class="i b" viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg>
  </button>
  <label id="l-speed" title="How fast the journey moves">Pace<input id="r-speed" type="range" min="0.4" max="2.5" step="0.05" value="1" aria-label="Pace"></label>
  <label id="l-strange" title="How often the worlds turn strange">Earthly<input id="r-strange" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="How strange the worlds are">Strange</label>
  <button id="b-sound" title="Sound (S)" aria-label="Sound">
    <svg class="i a" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M11 6l3.5 4M14.5 6L11 10"/></svg><svg class="i b" viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M10.5 5.5a3.5 3.5 0 010 5M12.5 3.5a6.3 6.3 0 010 9"/></svg>
  </button>
  <button id="b-next" title="Hurry to the next portal (→)" aria-label="Hurry to the next portal"><svg class="i" viewBox="0 0 16 16"><path d="M2 8h8M7 4.5L10.5 8 7 11.5M13.5 3v10"/></svg></button>
  <button id="b-gentle" title="Gentle: a steady camera, a level horizon, no rides (G)" aria-label="Gentle flight" aria-pressed="false"><svg class="i" viewBox="0 0 16 16"><path d="M1.5 8c2.2-3.4 4.3-3.4 6.5 0s4.3 3.4 6.5 0"/></svg></button>
  <button id="b-heart" title="Keep this world as a favourite (H)" aria-label="Keep this world as a favourite" aria-pressed="false">
    <svg class="i a" viewBox="0 0 16 16"><path d="M8 13.6S2 9.8 2 5.9a3.1 3.1 0 0 1 6-1.2 3.1 3.1 0 0 1 6 1.2c0 3.9-6 7.7-6 7.7z"/></svg><svg class="i b" viewBox="0 0 16 16"><path d="M8 13.6S2 9.8 2 5.9a3.1 3.1 0 0 1 6-1.2 3.1 3.1 0 0 1 6 1.2c0 3.9-6 7.7-6 7.7z" fill="currentColor"/></svg>
  </button>
  <button id="b-photo" title="Save a picture (P)" aria-label="Save a picture"><svg class="i" viewBox="0 0 16 16"><path d="M1.5 5h3l1-1.5h5l1 1.5h3v8h-13z"/><circle cx="8" cy="8.8" r="2.4"/></svg></button>
  <button id="b-share" title="Share: a link to this world, a link to this journey, a picture" aria-label="Share" aria-haspopup="menu" aria-expanded="false"><svg class="i" viewBox="0 0 16 16"><path d="M8 10V2M5 4.6L8 1.8l3 2.8M3.5 7.5v6h9v-6"/></svg></button>
  <button id="b-worlds" title="Gallery of all the worlds (I)" aria-label="Gallery of all the worlds"><svg class="i" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg></button>
  <button id="b-more" title="Options: graphics, style, ride and more (O)" aria-label="Options"><svg class="i" viewBox="0 0 16 16"><path d="M1.5 4h6M11 4h3.5M1.5 8h2.5M7.5 8h7M1.5 12h7.5M12.5 12h2"/><circle cx="9.2" cy="4" r="1.6"/><circle cx="5.7" cy="8" r="1.6"/><circle cx="10.8" cy="12" r="1.6"/></svg></button>
  <button id="b-vr" title="View in a VR headset" aria-label="Enter VR" style="display:none"><svg class="i" viewBox="0 0 16 16"><path d="M1.5 5h13v6.5h-4.2L8 9.3l-2.3 2.2H1.5z"/><circle cx="5" cy="8" r="1.2"/><circle cx="11" cy="8" r="1.2"/></svg></button>
  <button id="b-full" title="Fullscreen (F)" aria-label="Fullscreen"><svg class="i" viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
</div>
<div id="panel" hidden>
  <label>Graphics<select id="s-quality"><option value="auto">Auto</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="ultra">Ultra</option></select></label>
  <div id="q-info" class="note"></div>
  <label title="Steady is the gentle flight: a level horizon, slow turns, no rides (G)">Camera<select id="s-camera"><option value="sweeping">Sweeping</option><option value="steady">Steady (gentle)</option></select></label>
  <label>Art style<select id="s-style"></select></label>
  <label>Ride<select id="s-ride"></select></label>
  <label>Companion<select id="s-companion"></select></label>
  <label title="Worlds you have not seen on this device come first">Worlds<select id="s-order"><option value="new">New to you first</option><option value="any">Any order</option><option value="hearts" disabled>Favourites only</option></select></label>
  <label>Hour<select id="s-hour"><option value="any">Any</option><option value="golden">Golden hours</option><option value="night">Night owl</option><option value="day">Daylight</option><option value="clock">My clock</option></select></label>
  <div class="row"><span>Worlds</span><div id="kinds"></div></div>
  <div class="row checks"><label class="check"><input id="c-titles" type="checkbox" checked>Title cards</label><label class="check" title="The world's name and the site's address at the foot of a saved picture"><input id="c-caption" type="checkbox" checked>Caption on pictures</label></div>
  <div class="row foot" id="about-row" hidden><button id="b-about">About Portals</button></div>
</div>
<div id="share" role="menu" aria-label="Share" hidden>
  <button id="sh-world" role="menuitem" title="A link that opens on the world on screen">Copy link to this world</button>
  <button id="b-link" role="menuitem" title="A link that replays this journey: the same worlds in the same order">Copy journey link</button>
  <button id="sh-photo" role="menuitem" title="Save the view as a picture (P)">Save picture</button>
</div>
<div id="debug"></div>
<script type="module" src="./src/main.js"></script>
<script nomodule>document.getElementById('veil-sub').textContent = 'this browser is too old to show the worlds';</script>
</body>
</html>
